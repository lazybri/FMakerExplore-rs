name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            artifact: dist/fmaker-explore-gui-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact: dist/fmaker-explore-gui-windows-x86_64.zip
          - name: macos
            os: macos-14
            qt_arch: clang_64
            artifact: dist/fmaker-explore-gui-macos.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libudev-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust lint (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh --dynamic --clean --package

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh --dynamic --clean --package

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-windows.ps1 -Dynamic -Configuration Release -Clean -Package

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./build/fmaker-explore-gui --version

      - name: UI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/fmaker-explore-gui --smoke-test

      - name: C++ unit tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./build/fmaker-explore-gui.app/Contents/MacOS/fmaker-explore-gui --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter fmaker-explore-gui.exe -Recurse | Select-Object -First 1
          & $exe.FullName --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmaker-explore-gui-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
