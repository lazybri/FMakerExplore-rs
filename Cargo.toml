[package]
name = "fmaker-explore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MakerCmd filesystem utility for Fuji and Mitsu handsets"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
